[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["verify"]

[workspace.package]
version = "2.10.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22"
aes = "0.8"
cfb-mode = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "alloc"] }
chrono-tz = "0.10"
cipher = "0.4"
crc32fast = "1"
des = "0.8"
digest = "0.10"
dns-lookup = "2"
encoding_rs = "0.8"
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.10"
network-interface = "2"
notify = "8"
pem = "3"
postgres = "0.19"
quick-xml = "0.37"
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
socket2 = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
syn = { version = "2", features = ["derive"] }
quote = "1"
proc-macro2 = "1"
webpki-roots = "0.26"
ring = "0.17"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
toml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
